[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmmp-integrations-flowable"
version = "0.1.0"
description = "Flowable REST API Integration SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tmmp-integrations-shared",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmmp_integrations_flowable = ["py.typed"]
