[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmmp-integrations-shared"
version = "0.1.0"
description = "Enterprise Shared Integration Platform Foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmmp_integrations_shared = ["py.typed"]
